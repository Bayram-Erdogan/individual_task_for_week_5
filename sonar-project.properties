
# SonarQube project configuration
sonar.projectKey=BMI-Test-Project
sonar.projectName=BMI Test Project
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java compiled classes
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo code coverage report
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Source encoding
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=src/main/java/org/example/demo1/BMIController.java,src/main/java/org/example/demo1/BMIResultService.java,src/main/java/org/example/demo1/LocalizationService.java,src/main/java/org/example/demo1/HelloApplication.java
